# Bridges Sanity publishes to Workers Builds (which only rebuilds on git push).
# A Sanity webhook calls GitHub's repository_dispatch API; this workflow then
# pushes an empty commit to the production branch, which triggers Workers Builds.
name: Content rebuild

on:
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-rebuild
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Push empty commit to trigger Workers Builds
        run: |
          git config user.name "sanity-rebuild[bot]"
          git config user.email "noreply@utahux.com"
          git commit --allow-empty -m "chore: rebuild for Sanity content publish"
          git push
